# ==============================================================================
# BINARIO LINUX - SYSCTL TUNING (GAMING & SEGURIDAD)
# ==============================================================================

# --- GAMING & RENDIMIENTO DE MEMORIA ---
# Esencial para Proton/Wine, Steam y juegos con Unreal Engine 5 (evita crashes)
vm.max_map_count = 2147483642

# Optimización de swap y memoria RAM
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Límite máximo de descriptores de archivos
fs.file-max = 2097152

# Desactivar mitigación de split-locks para evitar caídas de FPS en juegos
kernel.split_lock_mitigate = 0

# --- RED DE BAJA LATENCIA ---
net.core.default_qdisc = fq_pie
net.ipv4.tcp_congestion_control = bbr
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192

# --- HARDENING DE SEGURIDAD ---
# Ocultar direcciones de punteros del kernel en dmesg
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
kernel.yama.ptrace_scope = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
